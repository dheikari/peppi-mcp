name: Windows read-only verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned development and live dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.lock -r requirements-live.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision Firefox and driver (separate network step)
        shell: pwsh
        run: |
          choco install firefox --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from peppi_mcp.firefox_runtime import open_firefox; d=open_firefox(headless=True); d.quit()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision Chrome and driver (separate network step)
        shell: pwsh
        run: |
          python -c "from peppi_mcp.browser_runtime import chrome_binary; assert chrome_binary() is not None, 'Install Google Chrome on this Windows runner'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from selenium.webdriver.common.selenium_manager import SeleniumManager; from peppi_mcp.browser_runtime import chrome_binary; SeleniumManager().binary_paths(['--browser','chrome','--browser-path',str(chrome_binary()),'--avoid-stats'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download pinned installation wheels (separate network step)
        shell: pwsh
        run: |
          python -m pip download --only-binary=:all: -r requirements-dev.lock -r requirements-live.lock -d .verification/wheelhouse
      - name: Test, build, inspect and install through stdio
        shell: pwsh
        env:
          SE_OFFLINE: 'true'
        run: python tools/release_check.py
      - name: Known-vulnerability audit (separate network step)
        shell: pwsh
        run: |
          python -m venv .venv-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv-audit/Scripts/python -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv-audit/Scripts/python -m pip_audit --no-deps --disable-pip -r requirements-live.lock -r requirements-dev.lock
